<text x="44" y="444" fill="#8f94a4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11">retraction → fail; expression of concern → fail; correction → warn; clear → pass + absence caveat.</text>
<text x="44" y="464" fill="#8f94a4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11">a failed notice query is skipped — the status stays unknown, never reported as clear.</text>
<text x="44" y="484" fill="#8f94a4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11">two verified queries only: /works/{doi} and /works?filter=updates:{doi}; update-to returns HTTP 400.</text>
<line x1="44" y1="564" x2="1056" y2="564" stroke="#dcd8ea" stroke-width="1"/>
<text x="44" y="588" fill="#4d5261" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5">config: root · timeoutMs · minIntervalMs · retries · maxRedirects · cacheTtlMs · maxBatch · batchConcurrency</text>
<text x="44" y="610" fill="#8f94a4" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="11.5">HTTPS only · exact-host allowlist api.crossref.org · manual redirect re-validation · no model call · REP v1 evidence</text>
